# Bot 'patronen-mini': dezelfde bot als 'patronen', maar met $50: laat zien wat een klein bedrag echt kan

[bot]
strategy = "patterns"
pattern_coins = ["BTC", "ETH", "SOL", "HYPE", "XRP", "DOGE", "SUI", "BNB", "AVAX", "LINK"]
# Pia recognises 19 patterns but only trades the ones that made money after costs on the first
# 70% AND the last 30% of 52 days of 15m candles AND of 208 days of 1h candles (test of 14 Nov 2026).
# The others are logged in pattern_seen.csv to build a live track record.
# 23 Nov 2026 weekly retest on fresh candles: the symmetrical triangle still made money on 1h candles
# (+28.2% / +15.4%) but LOST on the last 30% of 15m candles (+7.6% / -7.1%), so by the rule above it is out.
# No pattern passes both tests now. "none" matches no pattern: Pia trades nothing but keeps logging every
# pattern she sees in pattern_seen.csv (an empty list would mean "all patterns", which lost money).
patterns = ["none"]
risk_per_trade = 0.01       # a stop-loss hit costs at most 1% of the money
leaders = []
target_leaders = 0          # follows no traders
poll_seconds = 60           # minis poll half as often to spare the exchange's rate limit
data_dir = "data"

[paper]
starting_balance = 50.0     # the small amount the user wants to compare
fee_bps = 4.5
slippage_bps = 2.0

[risk]
max_leverage = 2.0
max_position_pct = 0.25
daily_loss_limit_pct = 0.05
max_drawdown_pct = 0.20
min_trade_usd = 10.0
allowed_coins = []
blocked_coins = []
