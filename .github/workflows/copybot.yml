# Free 24/7 paper trading on GitHub Actions (unlimited minutes for public repos).
# Every hour: review + self-improve (once a day), then paper trade for ~50 minutes.
# The bot's memory (positions, logs, journal) lives on the `copybot-data` branch,
# together with the live dashboard (index.html + dashboard.json) for GitHub Pages.
name: Copybot

on:
  schedule:
    # Safety net only: each run normally starts the next one itself. If GitHub fails to start a
    # run (it did once, a "startup_failure"), this restarts the bots within ~15 minutes. While a run
    # is busy, the concurrency group just queues/cancels these extra triggers.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # lets a finished run start the next one (see the last step)

concurrency:
  group: copybot
  cancel-in-progress: false

jobs:
  paper-trade:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Remember start time
        run: echo "RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r copybot/requirements.txt websockets

      - name: Load bot memory (copybot-data branch)
        run: |
          if git fetch --depth=1 origin copybot-data; then
            git worktree add -B copybot-data botdata FETCH_HEAD
          else
            git worktree add --orphan -b copybot-data botdata
          fi

      - name: Daily review and self-improvement (every bot)
        continue-on-error: true  # a failed review must never stop trading
        working-directory: copybot
        run: |
          python -m copybot -c config.ci.toml -d ../botdata tune --if-due 23 || true
          for f in bots/*.toml; do
            n=$(basename "$f" .toml)
            python -m copybot -c "$f" -d "../botdata/bots/$n" tune --if-due 23 || true
          done

      - name: Paper trade (5 x 10 min, all bots side by side)
        run: |
          compare_args() {
            echo "--bot basis=config.ci.toml:../botdata"
            for f in copybot/bots/*.toml; do n=$(basename "$f" .toml); echo "--bot $n=bots/$n.toml:../botdata/bots/$n"; done
          }
          save() {
            (cd copybot && python -m copybot -c config.ci.toml -d ../botdata export >/dev/null \
              && python -m copybot compare $(cd .. && compare_args) --out ../botdata/bots.json >/dev/null) || echo "export failed"
            cd botdata
            git add -A
            if git -c user.name="copybot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "copybot data $(date -u +%FT%TZ)"; then
              git push -q origin copybot-data || echo "push failed, will retry next block"
            fi
            cd ..
          }
          save
          # all bots in ONE process: they share the market data, look every 5 s, and are woken
          # within ~1 s by a websocket when one of the most active traders trades
          bots="--bot basis=config.ci.toml:../botdata"
          for f in copybot/bots/*.toml; do n=$(basename "$f" .toml); bots="$bots --bot $n=bots/$n.toml:../botdata/bots/$n"; done
          for i in 1 2 3 4 5; do
            (cd copybot && python -m copybot run-all $bots --minutes 10 --poll 5) || true
            save
          done

      - name: Show report
        if: always()
        run: '[ -f botdata/REPORT.md ] && cat botdata/REPORT.md >> "$GITHUB_STEP_SUMMARY" || true'

      # GitHub's hourly schedule is best-effort and often skips hours, which left the bots
      # idle for 3-4 hours at a time. So each run starts the next one when it ends.
      # Guard: only after a run that lasted 20+ minutes, so a crash can't loop every minute.
      - name: Start the next run
        if: always() && github.ref == 'refs/heads/3.x'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          elapsed=$(( $(date +%s) - RUN_STARTED ))
          if [ "$elapsed" -ge 1200 ]; then
            gh workflow run copybot.yml --ref 3.x --repo "$GITHUB_REPOSITORY" && echo "next run requested"
          else
            echo "run lasted only ${elapsed}s: not chaining (the hourly schedule will retry)"
          fi
